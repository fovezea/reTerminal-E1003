<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reTerminal WiFi Setup</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f4f5f7;color:#1c1e21}
  .card{max-width:440px;margin:24px auto;background:#fff;border-radius:14px;padding:26px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:13px;color:#667;margin-bottom:8px}
  label{display:block;margin:16px 0 6px;font-weight:600;font-size:14px}
  select,input{width:100%;padding:11px;font-size:16px;border:1px solid #b9bec6;border-radius:9px;box-sizing:border-box;background:#fff}
  button{margin-top:22px;width:100%;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:9px;background:#2a7de1;color:#fff;cursor:pointer}
  button:active{background:#1f66bd}
  .note{font-size:13px;color:#667;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>reTerminal E1003</h1>
  <div class="sub">Choose your WiFi network and enter the password.</div>

  <label for="nets">Network</label>
  <select id="nets"><option>Scanning&hellip;</option></select>

  <label for="ssid">Or type the network name (SSID)</label>
  <input id="ssid" type="text" placeholder="Network name" autocomplete="off">

  <label for="pass">Password</label>
  <input id="pass" type="password" placeholder="Leave blank if the network is open">

  <button onclick="save()">Connect</button>
  <div class="note" id="msg"></div>
</div>

<script>
function $(i){return document.getElementById(i)}
function load(){
  fetch('/scan').then(function(r){return r.json()}).then(function(a){
    var s=$('nets'); s.innerHTML='';
    if(!a.length){ s.innerHTML='<option value="">(no networks found)</option>'; return; }
    a.forEach(function(n){
      var o=document.createElement('option');
      o.value=n.ssid;
      o.textContent=n.ssid+(n.open?'':'  (secured)')+'  '+n.rssi+' dBm';
      s.appendChild(o);
    });
  }).catch(function(){ $('nets').innerHTML='<option value="">(scan failed - type name below)</option>'; });
}
$('nets').addEventListener('change',function(){ $('ssid').value=this.value; });
function save(){
  var ssid=($('ssid').value||$('nets').value||'').trim();
  if(!ssid){ $('msg').textContent='Please choose or type a network name.'; return; }
  $('msg').textContent='Saving...';
  var body='ssid='+encodeURIComponent(ssid)+'&pass='+encodeURIComponent($('pass').value);
  fetch('/save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(){ $('msg').textContent='Saved! The device is now connecting. You can close this page.'; })
    .catch(function(){ $('msg').textContent='Error saving. Please try again.'; });
}
load();
</script>
</body>
</html>
