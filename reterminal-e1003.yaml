# ============================================================================
# reTerminal E1003 – Official Seeed Studio Configuration
# ============================================================================

esphome:
  name: reterminal-e1003
  friendly_name: "reTerminal E1003"

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal

wifi:
  ssid: "403"                 # <-- change
  password: "12345678"
  ap:
    ssid: "reterminal-e1003"
    password: "fallback123"

captive_portal:

logger:

# ===== API key – already a valid base64 string =====
api:
  encryption:
    key: "j3Xq9Bp8V1wL7kM2nR5tS6uW4zY8fC0dA1bE2fG3hI4="

ota:
  - platform: esphome
    password: "YOUR_OTA_PASSWORD"   # <-- change

# ============================================================
# Deep Sleep – wake every 5 minutes, stay awake 30s
# ============================================================
deep_sleep:
  run_duration: 30s
  sleep_duration: 5min

# ============================================================
# SPI Bus & IT8951 Display
# ============================================================
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

external_components:
  - source: github://pr#15346
    components: [it8951]
    refresh: 1h

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: seeed-reterminal-e1003
    update_interval: 5min
    lambda: |-
      // Read battery voltage
      id(battery_enable).turn_on();
      delay(100);
      float raw = id(raw_battery_voltage).sample();
      id(battery_enable).turn_off();
      float voltage = raw * 2.0;

      // Clear screen and display battery only
      it.clear();
      it.print(50, 200, id(my_font), Color::BLACK, "Battery:");
      it.printf(250, 200, id(my_font), Color::BLACK, "%.2f V", voltage);

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 48

# ============================================================
# I2C (SHT4x) – optional
# ============================================================
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ============================================================
# Outputs
# ============================================================
output:
  - platform: gpio
    pin:
      number: GPIO16
      inverted: true
    id: onboard_led_output

  - platform: gpio
    pin: GPIO40
    id: battery_enable
    inverted: false

# ============================================================
# Sensors
# ============================================================
sensor:
  # Temperature & Humidity (optional)
  - platform: sht4x
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 5min

  # Raw ADC for battery
  - platform: adc
    id: raw_battery_voltage
    pin: GPIO1
    attenuation: 11db
    update_interval: never

  # Template sensor for Home Assistant
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: V
    accuracy_decimals: 2
    icon: "mdi:battery"
    update_interval: 5min
    lambda: |-
      id(battery_enable).turn_on();
      delay(100);
      float raw = id(raw_battery_voltage).sample();
      id(battery_enable).turn_off();
      return raw * 2.0;

# ============================================================
# Light & Buttons (optional)
# ============================================================
light:
  - platform: binary
    name: "Onboard LED"
    output: onboard_led_output
    id: onboard_led_light

binary_sensor:
  - platform: gpio
    name: "Button Green"
    id: button_green
    pin:
      number: GPIO3
      mode: {input: true, pullup: true}
      inverted: true
    on_press:
      - light.toggle: onboard_led_light

  - platform: gpio
    name: "Button Right"
    id: button_right
    pin:
      number: GPIO4
      mode: {input: true, pullup: true}
      inverted: true

  - platform: gpio
    name: "Button Left"
    id: button_left
    pin:
      number: GPIO5
      mode: {input: true, pullup: true}
      inverted: true
